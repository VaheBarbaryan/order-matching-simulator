services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        - APP=api-gateway
    ports:
      - "3001:3000"
    env_file:
      - ./apps/api-gateway/.env
    volumes:
      - ./apps/api-gateway:/app/apps/api-gateway
      - api_node_modules:/app/node_modules
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        - APP=auth-service
    ports:
      - "3000:3000"
    env_file:
      - ./apps/auth-service/.env
    volumes:
      - ./apps/auth-service:/app/apps/auth-service
      - auth_node_modules:/app/node_modules 

volumes:
  api_node_modules:
  auth_node_modules:
